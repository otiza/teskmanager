<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager - Projet TRBIB1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>Task Manager</h1>
        <p class="subtitle">Suivi clair des tâches, responsables et dates limites.</p>
      </header>

      <form id="task-form" class="card">
        <div class="grid-2">
          <input id="title" type="text" placeholder="Titre de la tâche" required />
          <input id="assigned_to" type="text" placeholder="Attribuée à (ex: Alice)" />
        </div>
        <textarea id="description" rows="3" placeholder="Description (optionnelle)"></textarea>
        <div class="grid-2">
          <input id="deadline" type="date" />
          <button type="submit">Ajouter la tâche</button>
        </div>
      </form>

      <section>
        <h2>Mes tâches</h2>
        <ul id="task-list"></ul>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
